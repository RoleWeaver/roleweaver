name: Build Role Weaver Release

on:
  workflow_dispatch:
    inputs:
      refresh_release:
        description: Rebuild and replace the existing VERSION release downloads from the selected branch
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Read Role Weaver version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if (-not $version) { throw "VERSION is empty." }
          "ROLEWEAVER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building Role Weaver $version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Validate Python source
        shell: pwsh
        run: |
          python -m py_compile nwn_ai_bot.py nwn_ai_gui.py roleweaver_backup.py roleweaver_storage.py roleweaver_crash.py roleweaver_pending.py roleweaver_drafts.py
          python -m unittest discover -s tests -v

      - name: Build Role Weaver executable
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:ROLEWEAVER_VERSION" "installer\RoleWeaver.iss"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\RoleWeaver\*" -DestinationPath "release\RoleWeaver-Portable-v$env:ROLEWEAVER_VERSION.zip" -Force

      - name: Create Neverwinter Vault portable ZIP
        shell: pwsh
        run: |
          Copy-Item "NEVERWINTER_VAULT_README.txt" "dist\RoleWeaver\NEVERWINTER_VAULT_README.txt" -Force
          Compress-Archive -Path "dist\RoleWeaver\*" -DestinationPath "release\RoleWeaver-NeverwinterVault-v$env:ROLEWEAVER_VERSION.zip" -Force

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $installer = "RoleWeaver-Setup-v$env:ROLEWEAVER_VERSION.exe"
          $portable = "RoleWeaver-Portable-v$env:ROLEWEAVER_VERSION.zip"
          Get-FileHash "release\$installer" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $installer" } |
            Set-Content "release\SHA256SUMS.txt"
          Get-FileHash "release\$portable" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $portable" } |
            Add-Content "release\SHA256SUMS.txt"
          $vault = "RoleWeaver-NeverwinterVault-v$env:ROLEWEAVER_VERSION.zip"
          Get-FileHash "release\$vault" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $vault" } |
            Add-Content "release\SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoleWeaver-Windows-v${{ env.ROLEWEAVER_VERSION }}
          path: |
            release/RoleWeaver-Setup-v${{ env.ROLEWEAVER_VERSION }}.exe
            release/RoleWeaver-Portable-v${{ env.ROLEWEAVER_VERSION }}.zip
            release/RoleWeaver-NeverwinterVault-v${{ env.ROLEWEAVER_VERSION }}.zip
            release/SHA256SUMS.txt
          if-no-files-found: error


  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate, test and package Linux client
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk xdotool xclip xvfb xauth
          cd linux
          bash -n install-linux.sh start-role-weaver.sh
          bash install-linux.sh
          .venv/bin/python -m unittest discover -s tests -v
          xvfb-run -a .venv/bin/python tests/smoke_linux_gui.py
          cd ..
          version=$(cat VERSION)
          test "$version" = "$(cat linux/VERSION)"
          mkdir -p release
          git archive --format=tar --prefix="RoleWeaver-v$version-Linux/" HEAD:linux | gzip > "release/RoleWeaver-v$version-Linux.tar.gz"
          cd release
          sha256sum *.tar.gz > SHA256SUMS-Linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RoleWeaver-Linux
          path: release/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.refresh_release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve and verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          else
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES_v1.2.3.md
          files: release/*
          fail_on_unmatched_files: true
