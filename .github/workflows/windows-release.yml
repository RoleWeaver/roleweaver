name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Read Role Weaver version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if (-not $version) { throw "VERSION is empty." }
          "ROLEWEAVER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building Role Weaver $version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Validate Python source
        shell: pwsh
        run: |
          python -m py_compile nwn_ai_bot.py nwn_ai_gui.py

      - name: Build Role Weaver executable
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:ROLEWEAVER_VERSION" "installer\RoleWeaver.iss"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\RoleWeaver\*" -DestinationPath "release\RoleWeaver-Portable-v$env:ROLEWEAVER_VERSION.zip" -Force

      - name: Create Nexus Mods portable ZIP
        shell: pwsh
        run: |
          Copy-Item "NEXUSMODS_README.txt" "dist\RoleWeaver\NEXUSMODS_README.txt" -Force
          Compress-Archive -Path "dist\RoleWeaver\*" -DestinationPath "release\RoleWeaver-Nexus-v$env:ROLEWEAVER_VERSION.zip" -Force

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $installer = "RoleWeaver-Setup-v$env:ROLEWEAVER_VERSION.exe"
          $portable = "RoleWeaver-Portable-v$env:ROLEWEAVER_VERSION.zip"
          Get-FileHash "release\$installer" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $installer" } |
            Set-Content "release\SHA256SUMS.txt"
          Get-FileHash "release\$portable" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $portable" } |
            Add-Content "release\SHA256SUMS.txt"
          $nexus = "RoleWeaver-Nexus-v$env:ROLEWEAVER_VERSION.zip"
          Get-FileHash "release\$nexus" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $nexus" } |
            Add-Content "release\SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoleWeaver-Windows-v${{ env.ROLEWEAVER_VERSION }}
          path: |
            release/RoleWeaver-Setup-v${{ env.ROLEWEAVER_VERSION }}.exe
            release/RoleWeaver-Portable-v${{ env.ROLEWEAVER_VERSION }}.zip
            release/RoleWeaver-Nexus-v${{ env.ROLEWEAVER_VERSION }}.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(env.ROLEWEAVER_VERSION, 'alpha') || contains(env.ROLEWEAVER_VERSION, 'beta') }}
          files: |
            release/RoleWeaver-Setup-v${{ env.ROLEWEAVER_VERSION }}.exe
            release/RoleWeaver-Portable-v${{ env.ROLEWEAVER_VERSION }}.zip
            release/RoleWeaver-Nexus-v${{ env.ROLEWEAVER_VERSION }}.zip
            release/SHA256SUMS.txt
