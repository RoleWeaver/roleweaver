name: Feature request
description: Suggest an improvement to Role Weaver
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Roleplay problem or workflow
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: Describe how you would like Role Weaver to work.
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Primary audience
      options:
        - Players
        - Dungeon Masters
        - Both
    validations:
      required: true
