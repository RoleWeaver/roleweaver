name: Bug report
description: Report a reproducible Role Weaver problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include API keys, private Tells, or other sensitive information.
  - type: input
    id: version
    attributes:
      label: Role Weaver version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: AI provider
      options:
        - Google Gemini
        - OpenAI
        - LM Studio
        - Not applicable
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: NWN server/profile
      placeholder: "Arelith, TDN, Custom, etc."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Role Weaver
        2. ...
    validations:
      required: true
  - type: textarea
    id: activity
    attributes:
      label: Relevant Activity-panel output
      description: Remove sensitive information before pasting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys and private/sensitive information.
          required: true
