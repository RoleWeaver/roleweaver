name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Validate Python source
        shell: pwsh
        run: |
          python -m py_compile nwn_ai_bot.py nwn_ai_gui.py

      - name: Build Role Weaver executable
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\RoleWeaver.iss"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\RoleWeaver\*" -DestinationPath "release\RoleWeaver-Portable-v1.0.0.zip" -Force

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Get-FileHash "release\RoleWeaver-Setup-v1.0.0.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  RoleWeaver-Setup-v1.0.0.exe" } |
            Set-Content "release\SHA256SUMS.txt"
          Get-FileHash "release\RoleWeaver-Portable-v1.0.0.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  RoleWeaver-Portable-v1.0.0.zip" } |
            Add-Content "release\SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoleWeaver-Windows-v1.0.0
          path: |
            release/RoleWeaver-Setup-v1.0.0.exe
            release/RoleWeaver-Portable-v1.0.0.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/RoleWeaver-Setup-v1.0.0.exe
            release/RoleWeaver-Portable-v1.0.0.zip
            release/SHA256SUMS.txt
